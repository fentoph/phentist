name: Android debug SHA-1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phentist"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/phentist/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Print SHA-1 fingerprint
        shell: bash
        run: |
          set -euo pipefail
          echo "Phentist Android debug SHA-1:"
          SHA1=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/phentist/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | awk -F': ' '/SHA1:/ {print $2; exit}')
          test -n "$SHA1"
          echo "SHA1: $SHA1"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"

      - name: Delete temporary keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/phentist"
